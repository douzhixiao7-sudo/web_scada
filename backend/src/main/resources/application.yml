spring:
  application:
    name: scada-server
  config:
    import: optional:file:../.local/config/application-local.properties
server:
  address: 127.0.0.1
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
